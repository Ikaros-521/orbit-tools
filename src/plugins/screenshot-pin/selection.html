<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>select region</title>
<link rel="stylesheet" href="selection.css">
</head>
<body>
<canvas id="shot"></canvas>
<div id="box" hidden>
  <i id="hole"></i>
  <span id="size" class="mono"></span>
</div>
<canvas id="ink"></canvas>
<div id="toolbar" hidden>
  <div class="tb-group tb-tools">
    <button type="button" data-tool="select" title="选择抓手 (V)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 17 2.5-6.5L20 12 4 4z"/></svg>
    </button>
    <button type="button" data-tool="rect" title="矩形">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
    </button>
    <button type="button" data-tool="ellipse" title="椭圆">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
    </button>
    <button type="button" data-tool="arrow" title="箭头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M13 5h6v6"/></svg>
    </button>
    <button type="button" data-tool="pen" title="画笔">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
    </button>
    <button type="button" data-tool="text" title="文字 (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    </button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group tb-colors" id="colorGroup">
    <button type="button" data-color="#ff4d4f" class="tb-swatch" style="--sw:#ff4d4f" title="红"></button>
    <button type="button" data-color="#ff7a45" class="tb-swatch" style="--sw:#ff7a45" title="橙"></button>
    <button type="button" data-color="#ffc53d" class="tb-swatch" style="--sw:#ffc53d" title="黄"></button>
    <button type="button" data-color="#52c41a" class="tb-swatch" style="--sw:#52c41a" title="绿"></button>
    <button type="button" data-color="#1677ff" class="tb-swatch" style="--sw:#1677ff" title="蓝"></button>
    <button type="button" data-color="#ffffff" class="tb-swatch" style="--sw:#ffffff" title="白"></button>
    <button type="button" data-color="#141414" class="tb-swatch" style="--sw:#141414" title="黑"></button>
    <label class="tb-color-picker" title="自定义色盘">
      <input type="color" id="customColor" value="#ff4d4f">
      <span class="tb-picker-btn" id="customColorBtn">🎨</span>
    </label>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group tb-sizes" id="sizeGroup" title="画笔粗细 (可滚轮微调)">
    <button type="button" data-size="2" class="tb-szdot" title="2px"><i style="width:4px;height:4px"></i></button>
    <button type="button" data-size="4" class="tb-szdot on" title="4px"><i style="width:7px;height:7px"></i></button>
    <button type="button" data-size="8" class="tb-szdot" title="8px"><i style="width:11px;height:11px"></i></button>
    <input type="range" id="sizeSlider" min="1" max="32" value="4" class="tb-slider" title="滑动微调粗细">
    <span id="sizeVal" class="tb-size-val">4px</span>
  </div>
  <div class="tb-group tb-text-opts" id="textGroup" style="display:none">
    <select id="textFont" class="tb-select" title="字体">
      <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">默认无衬线</option>
      <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
      <option value="'SimHei', 'PingFang SC', sans-serif">黑体</option>
      <option value="'KaiTi', 'STKaiti', serif">楷体</option>
      <option value="'SimSun', serif">宋体</option>
      <option value="'Consolas', monospace">等宽代码</option>
      <option value="'Georgia', serif">衬线体</option>
    </select>
    <select id="textSize" class="tb-select" title="字号">
      <option value="14">14px</option>
      <option value="16">16px</option>
      <option value="18">18px</option>
      <option value="20" selected>20px</option>
      <option value="24">24px</option>
      <option value="28">28px</option>
      <option value="36">36px</option>
      <option value="48">48px</option>
      <option value="64">64px</option>
    </select>
    <button type="button" id="textBold" class="tb-bold-btn on" title="加粗">B</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group tb-acts">
    <button type="button" data-act="undo" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 0 1 15.36-6.36L21 9"/></svg>
    </button>
    <button type="button" data-act="copy" title="复制到剪贴板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button type="button" data-act="save" title="保存文件">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button type="button" data-act="pin" class="tb-primary" title="悬浮贴图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/></svg>
    </button>
    <button type="button" data-act="cancel" title="取消 (ESC)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
</div>
<div id="tip">拖拽框选区域 · 右键显隐工具栏 · ESC 取消</div>
<script src="selection.js"></script>
</body>
</html>
