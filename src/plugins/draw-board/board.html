<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>draw board</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
<canvas id="backdrop"></canvas>
<canvas id="ink"></canvas>

<div id="bar">
  <div class="drag-handle" id="drag-handle" title="按住拖动工具栏">⋮⋮</div>
  <div class="grp" id="bgModes">
    <button type="button" class="bg-btn on" data-bg="screen" title="屏幕底图模式 (当前页面)">🖥️ 屏幕</button>
    <button type="button" class="bg-btn" data-bg="white" title="白板模式 (纯白画布)">⬜ 白板</button>
    <button type="button" class="bg-btn" data-bg="black" title="黑板模式 (墨黑画布)">⬛ 黑板</button>
  </div>
  <div class="sep"></div>
  <div class="grp" id="tools"></div>
  <div class="sep"></div>
  <div class="grp" id="colors"></div>
  <label class="color-picker-label" title="自定义色盘">
    <input type="color" id="customColor" value="#ff4d4f">
    <span class="color-picker-btn" id="customColorBtn">🎨</span>
  </label>
  <div class="sep" id="sizeSep"></div>
  <div class="grp" id="sizes"></div>
  <div class="size-slider-wrap" id="sizeSliderWrap" title="无级调节粗细 (可滚轮微调)">
    <input type="range" id="sizeSlider" min="1" max="40" value="4">
    <span id="sizeVal">4px</span>
  </div>
  <div class="grp text-controls" id="textControls" style="display:none">
    <select id="textFont" class="board-select" title="字体">
      <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">默认无衬线</option>
      <option value="'Microsoft YaHei', sans-serif">微软雅黑</option>
      <option value="'SimHei', 'PingFang SC', sans-serif">黑体</option>
      <option value="'KaiTi', 'STKaiti', serif">楷体</option>
      <option value="'SimSun', serif">宋体</option>
      <option value="'Consolas', monospace">等宽代码</option>
      <option value="'Georgia', serif">衬线体</option>
    </select>
    <select id="textSize" class="board-select" title="字号">
      <option value="14">14px</option>
      <option value="16">16px</option>
      <option value="18">18px</option>
      <option value="20" selected>20px</option>
      <option value="24">24px</option>
      <option value="28">28px</option>
      <option value="36">36px</option>
      <option value="48">48px</option>
      <option value="64">64px</option>
    </select>
    <button type="button" id="textBold" class="text-bold-btn on" title="加粗">B</button>
  </div>
  <div class="sep"></div>
  <button data-act="undo" title="撤销 (Ctrl+Z)">↶</button>
  <button data-act="redo" title="重做 (Ctrl+Y)">↷</button>
  <button data-act="clear" title="清空">⌫</button>
  <div class="sep"></div>
  <button data-act="pin" id="btnPin" title="悬浮到桌面 (Ctrl+P / F3)">📌</button>
  <button data-act="copy" id="btnCopy" title="复制到剪贴板 (Ctrl+C)">📋</button>
  <button data-act="save" id="btnSave" title="保存 PNG (Ctrl+S)">↧</button>
  <button data-act="exit" title="退出 (ESC)">✕</button>
</div>
<script src="board.js"></script>
</body>
</html>
