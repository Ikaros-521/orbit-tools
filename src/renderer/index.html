<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' plugin:; style-src 'self' 'unsafe-inline' plugin:; img-src 'self' data: plugin:; script-src 'self' plugin:; connect-src 'self' plugin:">
<title>Orbit Toolbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="platform-unknown lang-zh">
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<div class="chassis">
  <header class="rail">
    <div class="plate">
      <h1 class="plate-model">ORBIT·TOOLBOX <em>MK-1</em></h1>
      <p class="plate-sub" data-i18n="subtitle">插件化开发工具箱</p>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" data-view="home" data-i18n="tabTools">工具</button>
      <button type="button" data-view="plugins" data-i18n="tabPlugins">插件</button>
      <button type="button" data-view="settings" data-i18n="tabSettings">设置</button>
    </nav>
    <div class="rail-right">
      <div class="seg" id="langSeg" role="group" aria-label="语言 / Language">
        <button type="button" data-lang="zh">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <div class="seg" id="themeSeg" role="group" aria-label="主题 / Theme">
        <button type="button" data-theme="auto" title="跟随系统" aria-label="跟随系统">◐</button>
        <button type="button" data-theme="light" title="浅色" aria-label="浅色">☀</button>
        <button type="button" data-theme="dark" title="深色" aria-label="深色">☾</button>
      </div>
      <span class="winctl" id="winctl">
        <button type="button" data-act="minimize" aria-label="minimize">–</button>
        <button type="button" data-act="maximize" id="btnMax" aria-label="maximize">▢</button>
        <button type="button" data-act="close" aria-label="close">×</button>
      </span>
    </div>
  </header>

  <main class="stage">
    <!-- 工具面板 / tool palette -->
    <section class="view" id="viewHome">
      <div class="palette">
        <svg class="pal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="search" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="searchPh" placeholder="搜索工具…">
        <kbd id="hotHint" title="呼出热键">Alt+Space</kbd>
      </div>
      <p class="deck-meta" id="deckMeta"></p>
      <div class="deck" id="deck"></div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <!-- 插件面板视图 / plugin view -->
    <section class="view" id="viewPanel" hidden>
      <header class="panel-head">
        <button type="button" class="btn ghost" id="btnBack">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          <span data-i18n="back">返回</span>
        </button>
        <span class="panel-icon" id="panelIcon"></span>
        <div class="panel-title">
          <b id="panelName"></b>
          <span class="mono" id="panelMeta"></span>
        </div>
      </header>
      <div class="panel-host" id="panelHost"></div>
    </section>

    <!-- 插件管理中心 / plugins manager -->
    <section class="view" id="viewPlugins" hidden>
      <div class="plugins-header">
        <div class="plugin-search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input id="pluginSearch" type="text" spellcheck="false" autocomplete="off" data-i18n-ph="pluginSearchPh" placeholder="搜索插件…">
          <button type="button" class="btn-clear" id="btnPluginSearchClear" hidden title="清空搜索">✕</button>
        </div>
        <div class="plugin-actions-top">
          <button type="button" class="btn" id="btnRescan" data-i18n="rescan">重新扫描插件</button>
          <button type="button" class="btn ghost" id="btnUserPlugins" data-i18n="openUserPlugins">打开用户插件目录</button>
        </div>
      </div>

      <div class="plugin-filter-bar">
        <div class="filter-group" id="catFilter">
          <button type="button" class="pill on" data-cat="all" data-i18n="catAll">全部</button>
          <button type="button" class="pill" data-cat="media" data-i18n="catMedia">图像标注</button>
          <button type="button" class="pill" data-cat="system" data-i18n="catSystem">系统网络</button>
          <button type="button" class="pill" data-cat="dev" data-i18n="catDev">开发辅助</button>
        </div>
        <div class="filter-group filter-status" id="statusFilter">
          <button type="button" class="pill on" data-status="all" data-i18n="statusAll">全部</button>
          <button type="button" class="pill" data-status="enabled" data-i18n="statusEnabled">已启用</button>
          <button type="button" class="pill" data-status="disabled" data-i18n="statusDisabled">已禁用</button>
        </div>
        <span class="plugin-count-meta" id="pluginMeta"></span>
      </div>

      <div class="plugins-content">
        <div id="pluginList"></div>
        <p class="empty" id="pluginEmpty" hidden></p>
      </div>

      <footer class="pagination-bar" id="paginationBar">
        <button type="button" class="btn ghost small" id="btnPagePrev" data-i18n="pagePrev">上一页</button>
        <span class="page-indicator mono" id="pageIndicator"></span>
        <button type="button" class="btn ghost small" id="btnPageNext" data-i18n="pageNext">下一页</button>
      </footer>
    </section>

    <!-- 设置 / settings -->
    <section class="view" id="viewSettings" hidden>
      <div class="set-group">
        <div class="etiquette">GENERAL<span class="cn" data-i18n="setGeneral">／ 通用</span></div>
        <div class="set-row">
          <div class="set-label"><b data-i18n="hotkey">呼出热键</b><span data-i18n="hotkeyHint">显示 / 隐藏工具箱的全局快捷键</span></div>
          <div class="set-ctrl" id="hotkeyCtrl"></div>
        </div>
        <div class="set-row">
          <div class="set-label"><b data-i18n="langLabel">语言</b></div>
          <div class="seg" id="langSeg2">
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">English</button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-label"><b data-i18n="themeLabel">主题</b></div>
          <div class="seg" id="themeSeg2">
            <button type="button" data-theme="auto" data-i18n="themeAuto">跟随系统</button>
            <button type="button" data-theme="light" data-i18n="themeLight">浅色</button>
            <button type="button" data-theme="dark" data-i18n="themeDark">深色</button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-label"><b>插件中心</b><span>管理插件启停、自定义动作热键与用户插件</span></div>
          <button type="button" class="btn ghost" id="btnGotoPlugins">前往插件管理 →</button>
        </div>
      </div>

      <div class="set-group">
        <div class="etiquette">ABOUT<span class="cn" data-i18n="setAbout">／ 关于</span></div>
        <div class="set-row about-row">
          <span id="aboutVer" class="mono"></span>
          <button type="button" class="btn ghost" id="btnRepo">GitHub</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 右键上下文菜单 / card context menu -->
<div id="cardContextMenu" class="context-menu" hidden>
  <div class="ctx-title" id="ctxTitle"></div>
  <div class="ctx-item" data-action="launch" id="ctxLaunch">
    <span class="ctx-icon">🚀</span><span data-i18n="ctxLaunch">打开工具面板</span>
  </div>
  <div class="ctx-item" data-action="config" id="ctxConfig">
    <span class="ctx-icon">⚙️</span><span data-i18n="ctxConfigure">配置此插件 (热键)</span>
  </div>
  <div class="ctx-item" data-action="toggle" id="ctxToggle">
    <span class="ctx-icon">⚡</span><span id="ctxToggleText"></span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-action="folder" id="ctxFolder">
    <span class="ctx-icon">📂</span><span data-i18n="ctxOpenFolder">打开插件所在目录</span>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
