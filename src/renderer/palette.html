<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' plugin:; style-src 'self' 'unsafe-inline' plugin:; img-src 'self' data: plugin:; script-src 'self' plugin:; connect-src 'self' plugin:">
<title>Action Palette</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    background: transparent !important;
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    user-select: none;
  }
  .palette-window-wrapper {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .palette-window-wrapper .action-palette {
    width: 100% !important;
    max-width: 100% !important;
    height: calc(100% - 4px);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--line) !important;
    margin: 0 auto;
    animation: none !important;
  }
  .palette-window-wrapper .ap-list {
    max-height: none !important;
    flex: 1 1 auto;
    overflow-y: auto;
  }
</style>
</head>
<body class="lang-zh">
<div class="palette-window-wrapper">
  <div class="action-palette" id="actionPalette">
    <div class="ap-header">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="ap-input" id="apInput" placeholder="输入动作、插件名称或命令…" spellcheck="false" autocomplete="off" />
      <kbd class="ap-kbd" id="apCloseKbd">Esc</kbd>
    </div>
    <div class="ap-list" id="apList"></div>
    <div class="ap-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> 移动选择</span>
      <span><kbd>Enter</kbd> 触发 / 打开</span>
      <span><kbd>Esc</kbd> 收起</span>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="palette.js"></script>
</body>
</html>
