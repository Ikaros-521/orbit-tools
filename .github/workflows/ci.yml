name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node unit tests
        run: |
          node tools/test-color-math.js
          node tools/test-updater-flow.js
          node tools/test-ai-protocols.js

      - name: Run Electron smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx electron tools/smoke-plugins.js

      - name: Run Electron smoke tests (Windows)
        if: runner.os == 'Windows'
        run: npx electron tools/smoke-plugins.js
